services:
  - type: web
    name: sysmeasy
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && npm install --prefix elk_layout --no-audit --no-fund"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_API_KEY
        sync: false
