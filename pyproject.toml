[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysmeasy"
version = "2.5.0"
description = "AI-powered SysML v2 model generation and verification pipeline"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Samya Loukili", email = "samya.loukili@edu.umi.ac.ma" },
    { name = "Kenza El Khaniri", email = "kenza.elkhaniri@edu.umi.ac.ma" },
]
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "jinja2>=3.1.0",
    "jcs>=0.3.0",
    "antlr4-python3-runtime>=4.13.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["sysmeasy*"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
