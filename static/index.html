<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50 text-slate-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système Multi-Agents IA — SysML v2 | ENSAM Meknès</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- KaTeX for Dynamic LaTeX Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .ai-glow { box-shadow: 0 0 45px -5px rgba(59, 130, 246, 0.25); }
    </style>
</head>
<body class="h-full flex flex-col font-sans bg-white text-slate-800 overflow-hidden select-none">

    <!-- ============================================================== -->
    <!-- TOP HEADER                                                     -->
    <!-- ============================================================== -->
    <header class="min-h-14 sm:h-16 bg-white border-b border-slate-100 px-3 sm:px-6 py-2 sm:py-0 flex flex-wrap sm:flex-nowrap items-center justify-between shrink-0 z-20 shadow-sm gap-2">
        <div class="flex items-center gap-2.5 sm:gap-3.5">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20 shrink-0">
                <i data-lucide="cpu" class="w-5 h-5"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xs sm:text-sm font-bold text-slate-900 tracking-tight">SysmEasy</h1>
                    <span class="text-[10px] sm:text-[11px] font-semibold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 border border-blue-200/60">
                        ENSAM Meknès
                    </span>
                </div>
                <p class="text-[10px] sm:text-[11px] text-slate-500 font-normal hidden sm:block">Architecture Agentic AI — SysML v2</p>
            </div>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-3 ml-auto sm:ml-0">
            <!-- DUAL-PERSONA SWITCHER (VUE MÉTIER VS VUE EXPERT) -->
            <div class="flex items-center bg-slate-100 p-0.5 sm:p-1 rounded-xl border border-slate-200">
                <button onclick="setPersonaMode('metier')" id="persona-btn-metier" class="px-2 sm:px-3 py-1 rounded-lg text-[11px] sm:text-xs font-semibold bg-white text-blue-700 shadow-sm transition flex items-center gap-1 sm:gap-1.5">
                    <i data-lucide="briefcase" class="w-3.5 h-3.5 text-blue-600"></i>
                    <span class="hidden xs:inline">Métier</span>
                    <span class="hidden md:inline">(Simple)</span>
                </button>
                <button onclick="setPersonaMode('expert')" id="persona-btn-expert" class="px-2 sm:px-3 py-1 rounded-lg text-[11px] sm:text-xs font-medium text-slate-500 hover:text-slate-800 transition flex items-center gap-1 sm:gap-1.5">
                    <i data-lucide="cpu" class="w-3.5 h-3.5 text-slate-500"></i>
                    <span class="hidden xs:inline">Expert</span>
                    <span class="hidden md:inline">(SysML v2)</span>
                </button>
            </div>

            <!-- BOUTON MOBILE TOGGLE SIDEBAR (DRAWER) -->
            <button onclick="toggleMobileSidebar()" id="mobile-sidebar-btn" class="lg:hidden p-2 text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-lg border border-blue-200 transition" title="Ouvrir le panneau technique">
                <i data-lucide="panel-right" class="w-4 h-4"></i>
            </button>

            <button onclick="resetConversation()" class="p-2 sm:px-3.5 sm:py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 border border-slate-200 transition flex items-center gap-1.5" title="Réinitialiser">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 text-slate-500"></i>
                <span class="hidden sm:inline">Réinitialiser</span>
            </button>
        </div>
    </header>

    <!-- ============================================================== -->
    <!-- MAIN WORKSPACE : EXACTLY 2 PANELS (66% CHAT | 34% RIGHT BAR)    -->
    <!-- ============================================================== -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- ============================================================== -->
        <!-- PANEL 1 : MAIN CHAT AREA (RESPONSIVE FULL-WIDTH ON MOBILE)     -->
        <!-- ============================================================== -->
        <main class="flex-1 flex flex-col bg-slate-50/40 relative border-r border-slate-200/80 overflow-hidden w-full">
            
            <!-- CHAT SCROLL AREA -->
            <div id="chat-feed" class="flex-1 overflow-y-auto p-3 sm:p-6 flex flex-col justify-between">
                
                <!-- WELCOME VIEW (DEFAULT INITIAL SCREEN) -->
                <div id="welcome-view" class="my-auto max-w-2xl mx-auto w-full text-center py-4 sm:py-6 flex flex-col items-center">
                    
                    <div class="mb-4 sm:mb-6">
                        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-gradient-to-b from-blue-50 to-blue-100/70 border border-blue-200/60 flex items-center justify-center text-blue-600 shadow-md shadow-blue-500/10">
                            <span class="text-xl sm:text-2xl font-bold tracking-wider font-mono">AI</span>
                        </div>
                    </div>

                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mb-2">Bonjour !</h2>
                    <p class="text-xs sm:text-sm text-slate-500 max-w-md mx-auto leading-relaxed mb-6 px-2">
                        Décrivez votre besoin en langage naturel ou attachez un cahier des charges (PDF, texte) pour générer et vérifier votre architecture SysML v2.
                    </p>

                </div>

                <!-- MESSAGES CONTAINER -->
                <div id="messages-list" class="space-y-4 max-w-3xl w-full mx-auto hidden pb-4"></div>

            </div>

            <!-- COMPOSER FIXED AT BOTTOM -->
            <div class="p-3 sm:p-5 bg-gradient-to-t from-white via-white/95 to-transparent shrink-0">
                <div class="max-w-3xl mx-auto">
                    <div id="attached-file-badge" class="hidden items-center gap-2 mb-2 px-3 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded-full text-xs w-max">
                        <i data-lucide="paperclip" class="w-3.5 h-3.5"></i>
                        <span id="attached-file-name" class="font-medium max-w-[200px] sm:max-w-xs truncate">cahier_des_charges.txt</span>
                        <button onclick="removeAttachment()" class="text-blue-500 hover:text-blue-800 ml-1">✕</button>
                    </div>

                    <form id="composer-form" onsubmit="handleSendMessage(event)" class="flex items-center gap-1.5 sm:gap-2.5 bg-white border border-slate-200/90 rounded-full px-2.5 sm:px-3 py-1.5 sm:py-2 shadow-sm focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/10 transition">
                        <button type="button" onclick="document.getElementById('file-input').click()" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center shrink-0 transition" title="Joindre un fichier">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                        <input type="file" id="file-input" onchange="handleFileSelected(event)" class="hidden" accept=".txt,.sysml,.pdf,.doc,.json">

                        <input type="text" id="user-input" placeholder="Tapez votre message ou besoin..." autocomplete="off" class="flex-1 bg-transparent border-0 px-2 text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none">

                        <button type="submit" id="btn-send" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center shrink-0 shadow-md shadow-blue-500/20 transition">
                            <i data-lucide="send" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                        </button>
                    </form>
                </div>
            </div>

        </main>

        <!-- BACKDROP POUR MOBILE DRAWER -->
        <div id="mobile-sidebar-backdrop" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-slate-900/40 z-30 hidden lg:hidden transition-opacity"></div>

        <!-- ============================================================== -->
        <!-- PANEL 2 : RIGHT TECHNICAL SIDEBAR                              -->
        <!-- ============================================================== -->
        <aside id="right-sidebar" class="fixed lg:static top-0 right-0 h-full w-[85%] max-w-[380px] lg:w-[280px] xl:w-[320px] bg-white flex flex-col justify-between shrink-0 overflow-hidden z-40 transition-transform duration-300 transform translate-x-full lg:translate-x-0 shadow-2xl lg:shadow-none border-l border-slate-200/80 p-4">
            
            <!-- HEADER MOBILE DE LA SIDEBAR (VISIBLE UNIQUEMENT SUR MOBILE) -->
            <div class="lg:hidden h-12 border-b border-slate-100 flex items-center justify-between pb-2 shrink-0">
                <span class="text-xs font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="settings" class="w-4 h-4 text-blue-600"></i>
                    Configuration
                </span>
                <button type="button" onclick="toggleMobileSidebar()" class="px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 text-xs font-semibold border border-slate-200">
                    Fermer
                </button>
            </div>



            <!-- GEMINI API KEY WIDGET ATTACHÉ EN BAS DE LA SIDEBAR -->
            <div class="pt-3 border-t border-slate-200">
                <div id="gemini-key-panel" class="mb-3 p-3 rounded-xl bg-slate-50 border border-slate-200 shadow-sm space-y-2.5">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-bold text-slate-800 flex items-center gap-1.5">
                            <i data-lucide="key-round" class="w-3.5 h-3.5 text-blue-600"></i>
                            Clé API Google Gemini
                        </span>
                        <button type="button" onclick="toggleGeminiKeyPanel()" class="text-slate-400 hover:text-slate-600 text-xs">✕</button>
                    </div>
                    <div class="space-y-2">
                        <input id="gemini-key-input" type="password" placeholder="Collez votre clé API..." class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-800 outline-none focus:border-blue-500">
                        <button type="button" id="gemini-key-save-btn" onclick="saveGeminiApiKey()" class="w-full py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold transition">
                            Enregistrer la clé
                        </button>
                    </div>
                    <div id="gemini-key-feedback" class="text-[11px] hidden"></div>
                </div>
                <button type="button" onclick="toggleGeminiKeyPanel()" id="gemini-key-toggle-btn" class="w-full flex items-center justify-between px-3 py-2 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-xs font-medium text-slate-700 transition shadow-sm">
                    <span class="flex items-center gap-2">
                        <i data-lucide="key" class="w-3.5 h-3.5 text-blue-600"></i>
                        <span>Clé Gemini</span>
                    </span>
                    <span id="gemini-key-status-badge" class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-500">Vérification…</span>
                </button>
            </div>

        </aside>

    </div>

    <!-- SCRIPT DE GESTION UNIFIÉE SSOT (SINGLE SOURCE OF TRUTH) -->
    <script>
        lucide.createIcons();

        // 1. LES MODÈLES CANONIQUES PIVOTS COMPLETS (SSOT)
        let currentPersona = 'metier'; // 'metier' ou 'expert'

        const CANONICAL_MODELS = {
            powertrain: {
                title: "Chaîne de Traction Hybride (IBD)",
                badge: "Domaine Mécanique",
                diagram_img: "/images/sysml_ibd_official_rendered.png",
                metier: {
                    title: "Groupe Motopropulseur & Transmission Hybride",
                    summary: [
                        { name: "Moteur de Traction (part motor : ElectricMotor)", role: "Fournit la force motrice principale (300 N·m) en convertissant l'électricité de la batterie en couple mécanique.", icon: "zap", color: "text-blue-600" },
                        { name: "Arbre de Transmission (part shaft : TransmissionShaft)", role: "Axe mécanique renforcé transmettant la rotation du moteur vers les roues motrices.", icon: "repeat", color: "text-emerald-600" },
                        { name: "Capteur Télémétrie Déporté (part sensor : StandaloneSensor)", role: "Capteur autonome mesurant la vitesse de rotation. Statut d'ingénierie : INTENTIONALLY_STANDALONE.", icon: "radio", color: "text-amber-600" }
                    ],
                    pdf_references: [
                        { page: "Page 14, §3.2.1", quote: "Le moteur doit délivrer un couple nominal de 300 N·m aux roues motrices.", impact: "Définit le dimensionnement de l'arbre de transmission." },
                        { page: "Page 22, §5.4", quote: "L'autonomie globale en mode zéro émission doit dépasser 500 km en cycle WLTP.", impact: "Conditionne la capacité minimale du pack batterie." }
                    ],
                    alerts: [
                        { title: "Couplage arrière non tranché", text: "Le cahier des charges exige une motricité intégrale (4x4) mais ne précise pas si le train arrière a un arbre mécanique ou un 2e moteur électrique. Point à trancher avec les Achats.", severity: "Modérée" }
                    ]
                },
                sysml_code: `package Powertrain_System {
    // 1. Exigences Non-Fonctionnelles & Traçabilité (satisfy)
    requirement def AutonomieWLTP {
        doc /* L'autonomie en mode 100% électrique doit dépasser 500 km */
        attribute minRange = 500 [km];
    }
    requirement def CoupleNominal {
        doc /* Le moteur doit fournir un couple nominal supérieur à 300 N·m */
        attribute nominalTorque = 300 [N·m];
    }

    // 2. Définitions d'Items physiques et de signaux
    item def MechanicalTorque;
    item def ControlSignal;

    // 3. Définitions de Ports typés avec direction formelle
    port def MechanicalDrivePort { out torque : MechanicalTorque; }
    port def MechanicalLoadPort  { in torque : MechanicalTorque; }
    port def CommandPort         { in cmd : ControlSignal; }

    // 4. Définitions des blocs matériels (Part Definitions)
    part def ElectricMotor {
        satisfy CoupleNominal;
        port p_out : MechanicalDrivePort;
        port p_cmd : CommandPort; // Composant multi-ports
    }
    part def TransmissionShaft {
        port p_in : MechanicalLoadPort;
    }
    part def StandaloneSensor {
        port telemetry : CommandPort;
    }

    // 5. Architecture Interne (IBD Context)
    part def PowertrainContext {
        satisfy AutonomieWLTP;
        
        part motor : ElectricMotor;
        part shaft : TransmissionShaft;
        part sensor : StandaloneSensor; // Statut: INTENTIONALLY_STANDALONE

        // Connexion validée avec flux d'énergie mécanique explicite
        connect motor.p_out to shaft.p_in {
            flow of MechanicalTorque from motor.p_out to shaft.p_in;
        }

        // TENTATIVE INCOMPATIBLE BLOQUÉE PAR LE KNOWLEDGE GRAPH (INV-01) :
        // connect motor.p_out to sensor.telemetry; // Rejeté : Torque != Signal !
    }
}`,
                matrices: {
                    M_domaine: [
                        { src: "motor.p_out", dst: "shaft.p_in", dom: "mechanical_torque", status: "1 (Valide ✓)" },
                        { src: "motor.p_out", dst: "sensor.telemetry", dom: "mechanical ≠ signal", status: "0 (Rejeté ✗)" }
                    ],
                    direction_logic: [
                        { src_dir: "out", dst_dir: "in", rule: "Alimentation Source ──> Charge", status: "VALIDE ✓", class: "text-emerald-600 font-bold" },
                        { src_dir: "out", dst_dir: "out", rule: "Conflit de Sources (Court-circuit)", status: "REJETÉ ✗", class: "text-red-600 font-bold" },
                        { src_dir: "in", dst_dir: "in", rule: "Absence de Source (Circuit inerte)", status: "REJETÉ ✗", class: "text-red-600 font-bold" },
                        { src_dir: "Port", dst_dir: "~Port", rule: "Interface Service Conjuguée", status: "VALIDE ✓", class: "text-emerald-600 font-bold" }
                    ],
                    M_item: [
                        { name: "flow of MechanicalTorque", qty: "Moment de force / Couple", unit: "[N·m]", border: "border-emerald-200", bg: "bg-emerald-50/60", txt: "text-emerald-900" },
                        { name: "flow of ControlSignal", qty: "Trame de consigne logique", unit: "[CAN / PWM]", border: "border-blue-200", bg: "bg-blue-50/60", txt: "text-blue-900" }
                    ],
                    M_statut: [
                        { comp: "motor, shaft", desc: "Composants actifs dans le flux principal", status: "CONNECTED_ACTIVE", badge: "bg-emerald-100 text-emerald-700" },
                        { comp: "sensor", desc: "Capteur autonome de télémétrie", status: "INTENTIONALLY_STANDALONE", badge: "bg-amber-100 text-amber-800" }
                    ]
                },
                traceability: [
                    { id: "REQ-PERF-01", name: "Autonomie WLTP", expr: "minRange >= 500 [km]" },
                    { id: "REQ-TORQUE-02", name: "Couple Nominal", expr: "nominalTorque >= 300 [N·m]" }
                ]
            },

            battery: {
                title: "Système de Charge Haute Tension & Gestion Thermique",
                badge: "Domaine Électrique & Action Flow",
                diagram_img: "/images/battery_ibd_rendered.png",
                metier: {
                    title: "Gestionnaire Automatique de Charge Haute Tension",
                    summary: [
                        { name: "Pack Énergie & BMS (battery)", role: "Stocke l'énergie électrique du véhicule et surveille son pourcentage de charge en direct.", icon: "battery-charging", color: "text-emerald-600" },
                        { name: "Borne / Onduleur de Charge (powerSystem)", role: "Injecte le courant régulé tant que le niveau mesuré reste sous le seuil maximal de 100%.", icon: "zap", color: "text-blue-600" },
                        { name: "Sonde Thermique Pack (thermalSensor)", role: "Capteur autonome mesurant la température des cellules. Statut d'ingénierie : INTENTIONALLY_STANDALONE.", icon: "shield", color: "text-amber-600" }
                    ],
                    pdf_references: [
                        { page: "Page 8, §2.1", quote: "La charge doit démarrer automatiquement et s'arrêter strictement à 100% sans intervention humaine.", impact: "Impose la boucle d'asservissement logiciel." },
                        { page: "Page 11, §3.4", quote: "Sécurité thermique : interdiction formelle de continuer la charge si la batterie est pleine.", impact: "Justifie la condition de sortie qualifiée charging.monitor >= 100." }
                    ],
                    alerts: [
                        { title: "Plage thermique absente du document", text: "Le cahier des charges impose une coupure de sécurité thermique mais ne chiffre aucune plage de température. L'IA suggère -10 °C à +45 °C (à trancher en réunion de projet).", severity: "À confirmer" }
                    ]
                },
                sysml_code: `package 'Charging_System' {
    private import ScalarValues::*;
    
    // 1. Structure matérielle avec attributs d'état bornés
    part def Battery {
        attribute chargeLevel : Integer; // Borné [0..100] %
    }
    part def PowerSystem;

    // 2. Traçabilité d'Exigence Fonctionnelle
    requirement def SecuriteSurcharge {
        doc /* La charge doit s'arrêter strictement dès 100% */
        attribute seuilMax = 100 [%];
    }

    // 3. Définitions d'actions avec Parameter Pins et allocations (perform)
    action def MonitorBattery {
        in battery : Battery;
        out batteryCharge : Integer; // Parameter Output Pin
    }
    action def AddCharge {
        inout battery : Battery;
        in powerSystem : PowerSystem;
    }
    action def EndCharging;

    // 4. Comportement alloué au PowerSystem avec contrôle de boucle
    action def ChargeBattery {
        satisfy SecuriteSurcharge;
        inout battery : Battery;
        in powerSystem : PowerSystem;
        
        loop action charging {
            action monitor : MonitorBattery;
            
            then if monitor.batteryCharge < 100 {
                action add : AddCharge;
            }
        } until charging.monitor.batteryCharge >= 100;
        
        then action endCharging : EndCharging;
        then done;
    }
}`,
                matrices: {
                    M_domaine: [
                        { src: "powerSystem.pwr_out", dst: "battery.pwr_in", dom: "electrical_power", status: "1 (Valide ✓)" },
                        { src: "monitor.data_out", dst: "decision.guard", dom: "command_signal", status: "1 (Valide ✓)" }
                    ],
                    direction_logic: [
                        { src_dir: "out", dst_dir: "in", rule: "Injection Énergie vers Batterie", status: "VALIDE ✓", class: "text-emerald-600 font-bold" },
                        { src_dir: "out", dst_dir: "out", rule: "Court-circuit Électrique", status: "REJETÉ ✗", class: "text-red-600 font-bold" },
                        { src_dir: "in", dst_dir: "in", rule: "Deux Récepteurs sans Source", status: "REJETÉ ✗", class: "text-red-600 font-bold" },
                        { src_dir: "Port", dst_dir: "~Port", rule: "Interface Chargeur Conjuguée", status: "VALIDE ✓", class: "text-emerald-600 font-bold" }
                    ],
                    M_item: [
                        { name: "flow of ElectricalPower", qty: "Puissance de charge", unit: "[W / kW]", border: "border-purple-200", bg: "bg-purple-50/60", txt: "text-purple-900" },
                        { name: "parameter batteryCharge", qty: "Niveau de charge mesuré", unit: "[0..100] %", border: "border-emerald-200", bg: "bg-emerald-50/60", txt: "text-emerald-900" }
                    ],
                    M_statut: [
                        { comp: "battery", desc: "Porte l'état physique de charge", status: "CONNECTED_ACTIVE", badge: "bg-emerald-100 text-emerald-700" },
                        { comp: "powerSystem", desc: "Source d'énergie allouée à AddCharge", status: "CONNECTED_ACTIVE", badge: "bg-emerald-100 text-emerald-700" }
                    ]
                },
                traceability: [
                    { id: "REQ-SEC-01", name: "Sécurité Surcharge", expr: "seuilMax = 100 [%]" }
                ]
            }
        };

        // GESTION DU MODE BI-PROFIL (MÉTIER VS EXPERT)
        function setPersonaMode(mode) {
            currentPersona = mode;
            const btnMetier = document.getElementById('persona-btn-metier');
            const btnExpert = document.getElementById('persona-btn-expert');
            const tabsExpert = document.getElementById('tabs-expert-bar');
            const tabsMetier = document.getElementById('tabs-metier-bar');

            if (mode === 'metier') {
                if (btnMetier) btnMetier.className = "px-2 sm:px-3 py-1 rounded-lg text-[11px] sm:text-xs font-semibold bg-white text-blue-700 shadow-sm transition flex items-center gap-1 sm:gap-1.5";
                if (btnExpert) btnExpert.className = "px-2 sm:px-3 py-1 rounded-lg text-[11px] sm:text-xs font-medium text-slate-500 hover:text-slate-800 transition flex items-center gap-1 sm:gap-1.5";
                if (tabsMetier) tabsMetier.classList.remove('hidden');
                if (tabsExpert) tabsExpert.classList.add('hidden');
                switchTab('metier-fiche');
            } else {

        // NOTIFICATION TOAST EN LANGAGE NATUREL SANS POPUP BLOQUANTE
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-800 text-emerald-50 border-emerald-600' :
                       type === 'warning' ? 'bg-amber-800 text-amber-50 border-amber-600' :
                       type === 'info' ? 'bg-blue-800 text-blue-50 border-blue-600' :
                       'bg-slate-900 text-white border-slate-700';
            const icon = type === 'success' ? 'check-circle' :
                         type === 'warning' ? 'alert-triangle' :
                         type === 'info' ? 'info' : 'bell';
            toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-2.5 rounded-xl border shadow-xl text-xs font-semibold transition-all duration-300 transform translate-y-3 opacity-0 ${bg}`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.classList.remove('translate-y-3', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            }, 20);
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 350);
            }, 2800);
        }

        async function testPLMConnection() {
            const btn = document.getElementById('plm-test-btn');
            const resultEl = document.getElementById('plm-test-result');
            const serverUrl = document.getElementById('plm-server-url').value.trim();
            const apiToken = document.getElementById('plm-api-token').value.trim();

            if (!serverUrl) {
                resultEl.textContent = "Veuillez saisir l'URL du serveur.";
                resultEl.className = "text-[11px] text-amber-600 text-center";
                resultEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> Test en cours…`;
            lucide.createIcons();
            resultEl.classList.add('hidden');

            try {
                const res = await fetch('/api/plm/test-connection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ server_url: serverUrl, api_token: apiToken })
                });
                const data = await res.json();
                resultEl.textContent = data.message || "Réponse reçue du serveur.";
                resultEl.className = "text-[11px] text-slate-600 text-center";
                resultEl.classList.remove('hidden');
            } catch (err) {
                resultEl.textContent = "Impossible de joindre le serveur. Vérifiez l'URL et le réseau.";
                resultEl.className = "text-[11px] text-red-600 text-center";
                resultEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="plug" class="w-3.5 h-3.5"></i> Tester la connexion`;
                lucide.createIcons();
            }
        }

        async function exportPLMPayload() {
            const btn = document.getElementById('plm-export-btn');
            const modelKey = window.activeModelKey || 'powertrain';
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> Génération…`;
            lucide.createIcons();
            try {
                const res = await fetch(`/api/plm/export-payload/${modelKey}`);
                if (!res.ok) throw new Error('Erreur serveur');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sysml_v2_oslc_payload_${modelKey}.json`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (err) {
                alert('Erreur lors de la génération du payload. Vérifiez que le modèle est analysé.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="download" class="w-3.5 h-3.5"></i> Télécharger le payload OSLC/SysML v2`;
                lucide.createIcons();
            }
        }

                    headers['X-Gemini-Api-Key'] = storedUserKey;
                }
                const apiRes = await fetch('/api/run-pipeline', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        prompt: text,
                        attached_file_name: fileName,
                        attached_file_content: fileContent,
                        view_level: "component"
                    })
                });
                if (apiRes.ok) {
                    backendData = await apiRes.json();
                } else {
                    const errBody = await apiRes.json().catch(() => ({}));
                    backendError = errBody.detail || `Erreur serveur (${apiRes.status})`;
                }
            } catch (err) {
                backendError = "Impossible de joindre le serveur backend.";
            }

            if (backendError || !backendData || !backendData.model_key) {
                const procEl = document.getElementById(processingId);
                if (procEl) procEl.remove();
                const safeErr = String(backendError || "Réponse backend invalide.")
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                const errWrap = document.createElement('div');
                errWrap.className = "flex gap-3 items-start max-w-2xl";
                errWrap.innerHTML = `
                    <div class="w-7 h-7 rounded-full bg-red-600 text-white flex items-center justify-center shrink-0 font-bold text-xs shadow-sm">!</div>
                    <div class="bg-red-50 border border-red-200 rounded-2xl p-4 flex-1 text-xs text-red-800">
                        <p class="font-bold mb-1">Échec de l'analyse</p>
                        <p>${safeErr}</p>
                    </div>`;
                messagesList.appendChild(errWrap);
                scrollChat();
                removeAttachment();
                return;
            }

            await sleep(650);
            const a1El = document.getElementById(`${processingId}-a1`);
            if (a1El) {
                a1El.className = "flex items-center gap-2 text-emerald-600 font-medium";
                a1El.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> Agent 1 : Graphe Pivot extrait. 0 ambiguïté non résolue.`;
            }
            logOrchestrator(`A1 : Graphe sémantique extrait avec succès. Découpage modulaire appliqué.`);
            lucide.createIcons();

            await sleep(750);
            const a2El = document.getElementById(`${processingId}-a2`);
            if (a2El) {
                a2El.className = "flex items-center gap-2 text-emerald-600 font-medium";
                a2El.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> Agent 2 : Modèle SysML v2 généré avec allocations et liens satisfy.`;
            }
            logOrchestrator(`A2 : Code généré. Soumission formelle à l'Agent 3.`);
            lucide.createIcons();

            await sleep(700);
            const a3El = document.getElementById(`${processingId}-a3`);
            if (a3El) {
                a3El.className = "flex items-center gap-2 text-emerald-600 font-medium";
                a3El.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> Agent 3 : Les 5 Invariants Universels sont 100% Validés (0 anomalie).`;
            }
            logOrchestrator(`A3 : Audit réussi [INV-01 à INV-05]. Autorisation du rendu graphique.`);
            lucide.createIcons();

            // Mise à jour de la SSOT (Single Source of Truth)
            let activeModelKey = 'powertrain';
            if (backendData && backendData.model_key) {
                activeModelKey = backendData.model_key;
                CANONICAL_MODELS[activeModelKey] = {
                    title: backendData.title,
                    badge: backendData.badge,
                    diagram_img: backendData.diagram_img,
                    metier: backendData.metier,
                    sysml_code: backendData.sysml_code,
                    matrices: backendData.matrices,
                    traceability: backendData.traceability
                };
            } else {
                const isBattery = text.toLowerCase().includes('batterie') || text.toLowerCase().includes('charge');
                activeModelKey = isBattery ? 'battery' : 'powertrain';
            }

            // 3. SYNCHRONISATION INSTANTANÉE DE LA SIDEBAR DROITE AVEC LE BON SCÉNARIO !
            renderModelToSidebar(activeModelKey);

            // 4. Message de Sortie avec Image Diagramme & Navigation Modulaire
            await sleep(400);
            const m = CANONICAL_MODELS[activeModelKey];
            const cardId = 'card-' + Date.now();
            const resultMsgHtml = `

                    <div class="flex items-center justify-between">

                            <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i>
                            Modèle SysML v2 Validé et Restitué
                        </span>
                        <span class="text-[10px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">
                            Cas 1 : Conforme (« bon »)
                        </span>
                    </div>

                    <p class="text-slate-600 leading-relaxed">
                        Le système a validé le modèle <b>${m.title}</b>. Les 5 Invariants Universels sont respectés et les exigences sont tracées.
                    </p>

                    <!-- SÉLECTEUR DE VUE MODULAIRE (NIVEAUX DE DÉTAIL / VIEWPOINTS SANS JARGON) -->
                    <div class="bg-slate-50 border border-slate-200 p-2 sm:p-2.5 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div class="text-[11px] font-semibold text-slate-700 flex items-center gap-1.5">
                            <i data-lucide="layers" class="w-3.5 h-3.5 text-blue-600"></i>
                            <span>Granularité :</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-1 sm:gap-1.5" id="view-btns-${cardId}">
                            <button type="button" onclick="switchViewpoint(this, '${cardId}', '${activeModelKey}', 'system')" class="view-btn flex-1 sm:flex-none text-center px-2 py-1 text-[10px] sm:text-[10.5px] rounded-lg font-medium bg-white text-slate-700 border border-slate-200 hover:border-blue-400 hover:text-blue-600 shadow-2xs transition cursor-pointer">
                                Niv. 0 — Contexte
                            </button>
                            <button type="button" onclick="switchViewpoint(this, '${cardId}', '${activeModelKey}', 'component')" class="view-btn flex-1 sm:flex-none text-center px-2 py-1 text-[10px] sm:text-[10.5px] rounded-lg font-semibold bg-blue-600 text-white shadow-2xs transition cursor-pointer">
                                Niv. 1 — Blocs/Flux
                            </button>
                            <button type="button" onclick="switchViewpoint(this, '${cardId}', '${activeModelKey}', 'action')" class="view-btn flex-1 sm:flex-none text-center px-2 py-1 text-[10px] sm:text-[10.5px] rounded-lg font-medium bg-white text-slate-700 border border-slate-200 hover:border-blue-400 hover:text-blue-600 shadow-2xs transition cursor-pointer">
                                Niv. 2 — Modes/États
                            </button>
                        </div>
                    </div>

                    <div class="rounded-xl border border-slate-200 overflow-hidden bg-slate-50/50">
                        <div class="p-2.5 bg-slate-100/70 border-b border-slate-200 flex items-center justify-between">
                            <span id="diagram-title-${cardId}" class="text-[11px] font-semibold text-slate-700 flex items-center gap-1.5">
                                <i data-lucide="image" class="w-3.5 h-3.5 text-blue-600"></i>
                                Graphe SysML v2 : Niveau 1 (Blocs Matériels &amp; Échanges)
                            </span>
                            <a id="diagram-download-${cardId}" href="${m.diagram_img}" download="diagramme_sysml.png" class="px-2.5 py-1 rounded bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-medium flex items-center gap-1 transition">
                                <i data-lucide="download" class="w-3 h-3"></i>
                                Télécharger PNG
                            </a>
                        </div>
                        <div class="p-2 flex items-center justify-center bg-white min-h-[200px]">
                            <img id="diagram-img-${cardId}" src="${m.diagram_img}" alt="Diagramme SysML v2" class="max-h-72 w-auto object-contain cursor-pointer hover:scale-[1.02] transition duration-200" onclick="window.open(this.src, '_blank')" />
                        </div>
                    </div>

                    <!-- CARTOUCHES DE CONFIANCE & TRAÇABILITÉ MÉTIER (SANS JARGON) -->
                    <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-100">
                        <button type="button" class="text-left bg-emerald-50/70 border border-emerald-200/80 rounded-xl p-2.5 flex items-center gap-2 cursor-pointer hover:bg-emerald-100/70 transition" onclick="setPersonaMode('metier'); switchMetierTab('pdf');">
                            <i data-lucide="file-check" class="w-4 h-4 text-emerald-600 shrink-0"></i>
                            <div>
                                <div class="font-bold text-[11px] text-emerald-900">Cohérence Validée</div>
                                <div class="text-[10px] text-emerald-700">Tracé au PDF (Page 14 &amp; 22) →</div>
                            </div>
                        </button>
                        <button type="button" class="text-left bg-amber-50/70 border border-amber-200/80 rounded-xl p-2.5 flex items-center gap-2 cursor-pointer hover:bg-amber-100/70 transition" onclick="setPersonaMode('metier'); switchMetierTab('zones');">
                            <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600 shrink-0"></i>
                            <div>
                                <div class="font-bold text-[11px] text-amber-900">Vigilance Qualité</div>
                                <div class="text-[10px] text-amber-700">1 zone floue à trancher →</div>
                            </div>
                        </button>
                    </div>

                    <!-- BOUTON DE RAPPORT EXÉCUTIF PDF MULTI-DIAGRAMMES (COMPLÉMENT MÉTIER) -->
                    <div class="pt-1">
                        <a href="/api/export-report/${activeModelKey}" target="_blank" class="w-full py-2.5 px-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs flex items-center justify-center gap-2 shadow-sm transition">
                            <i data-lucide="file-text" class="w-4 h-4 text-blue-400"></i>
                            <span>Télécharger le Rapport PDF de Synthèse Métier (Multi-Vues + Commentaires IA)</span>
                        </a>
                    </div>

                    <div class="text-[11px] text-slate-500 flex items-center justify-between pt-1">
                        <span>Standard OMG SysML v2</span>
                        <span class="text-blue-600 font-medium cursor-pointer hover:underline" onclick="setPersonaMode('expert'); switchTab('kg');">Inspecter les matrices d'ingénierie →</span>
                    </div>
                </div>
            `;
            messagesList.insertAdjacentHTML('beforeend', resultMsgHtml);
            scrollChat();
            lucide.createIcons();
            removeAttachment();
        }

        // SWITCH VIEWPOINTS / GRANULARITÉ DANS LE CHAT (DYNAMIC & REACTIVE)
        function switchViewpoint(btn, cardId, modelKey, viewLevel) {
            // 1. Mise à jour de l'apparence des boutons du groupe
            const container = btn.parentElement;
            if (container) {
                container.querySelectorAll('.view-btn').forEach(b => {
                    b.className = "view-btn px-2.5 py-1 text-[10.5px] rounded-lg font-medium bg-white text-slate-700 border border-slate-200 hover:border-blue-400 hover:text-blue-600 shadow-2xs transition cursor-pointer";
                });
                btn.className = "view-btn px-2.5 py-1 text-[10.5px] rounded-lg font-semibold bg-blue-600 text-white shadow-2xs transition cursor-pointer";
            }

            // 2. Récupération des éléments cibles dans cette carte spécifique
            const imgEl = document.getElementById(`diagram-img-${cardId}`);
            const titleEl = document.getElementById(`diagram-title-${cardId}`);
            const downloadEl = document.getElementById(`diagram-download-${cardId}`);
            const m = CANONICAL_MODELS[modelKey];

            let newSrc = "";
            let newTitle = "";

            if (viewLevel === 'system') {
                newSrc = (modelKey === 'battery') ? "/images/diagram_charging_system_overview.png" : "/images/diagram_system_overview.png";
                newTitle = "Niv. 0 — Vue d'Ensemble Système (Macro-organes & Flux Principaux)";
            } else if (viewLevel === 'action') {
                newSrc = "/images/diagram_action_flow.png";
                newTitle = "Niv. 2 — Modes/États (Boucle d'Asservissement & Coupure)";
            } else { // component
                newSrc = (m && m.diagram_img) ? m.diagram_img : ((modelKey === 'battery') ? "/images/battery_ibd_rendered.png" : "/images/sysml_ibd_official_rendered.png");
                newTitle = "Niv. 1 — Blocs Matériels & Échanges Physiques (Interfaces Typées)";
            }

            if (imgEl) {
                imgEl.src = newSrc;
            }
            if (titleEl) {
                titleEl.innerHTML = `<i data-lucide="image" class="w-3.5 h-3.5 text-blue-600"></i> ${newTitle}`;
            }
            if (downloadEl) {
                downloadEl.href = newSrc;
            }
            lucide.createIcons();
        }

        function scrollChat() {
            const feed = document.getElementById('chat-feed');
            feed.scrollTop = feed.scrollHeight;
        }

        function logOrchestrator(msg) {
            const box = document.getElementById('orchestrator-log-box');
            if (!box) return;
            const time = new Date().toLocaleTimeString();
            box.innerHTML += `<br/>[${time}] ${msg}`;
            box.scrollTop = box.scrollHeight;
        }

        function copyCode() {
            const code = document.getElementById('sysml-code-block').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert("Code SysML v2 copié dans le presse-papier !");
            });
        }

        // ==============================================================
        // RÉINITIALISATION DE LA SIDEBAR À DROITE (ÉTAT DE VEILLE)
        // ==============================================================
        function resetSidebar() {
            setPersonaMode('metier');
            switchMetierTab('fiche');

            // 1. Réinitialisation Vue Métier
            const mTitle = document.getElementById('metier-title');
            if (mTitle) mTitle.textContent = "Synthèse Fonctionnelle du Produit";

            const mSummary = document.getElementById('metier-summary-box');
            if (mSummary) {
                mSummary.innerHTML = `
                    <div class="p-6 rounded-2xl bg-slate-50 border border-dashed border-slate-200 text-center space-y-2.5">
                        <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mx-auto shadow-2xs">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <div class="font-bold text-slate-700 text-xs">Aucun modèle actif</div>
                        <p class="text-[11px] text-slate-500 max-w-xs mx-auto leading-relaxed">
                            Posez une question ou cliquez sur un exemple dans le chat pour charger la fiche produit et les blocs fonctionnels.
                        </p>
                    </div>
                `;
            }

            const mPdf = document.getElementById('metier-pdf-box');
            if (mPdf) {
                mPdf.innerHTML = `
                    <div class="p-6 rounded-2xl bg-slate-50 border border-dashed border-slate-200 text-center text-slate-400 text-xs">
                        Aucune référence document disponible.<br/>Téléversez un PDF ou lancez une analyse.
                    </div>
                `;
            }

            const mAlerts = document.getElementById('metier-alertes-box');
            if (mAlerts) {
                mAlerts.innerHTML = `
                    <div class="p-6 rounded-2xl bg-slate-50 border border-dashed border-slate-200 text-center text-slate-400 text-xs">
                        Aucune alerte ni zone floue détectée pour le moment.
                    </div>
                `;
            }

            const mAlertCount = document.getElementById('metier-alert-count');
            if (mAlertCount) mAlertCount.textContent = "0 alerte";

            // 2. Réinitialisation Vue Expert
            const codeBlock = document.getElementById('sysml-code-block');
            if (codeBlock) codeBlock.textContent = "// En attente d'une requête utilisateur...\n// Le modèle SysML v2 généré apparaîtra ici.";

            const kgTitle = document.getElementById('kg-scenario-title');
            if (kgTitle) kgTitle.textContent = "Revue de Cohérence Métier";

            const kgBadge = document.getElementById('kg-scenario-badge');
            if (kgBadge) kgBadge.textContent = "En attente";

            const kgContainer = document.getElementById('kg-dynamic-container');
            if (kgContainer) {
                kgContainer.innerHTML = `
                    <div class="p-6 rounded-2xl bg-slate-50 border border-dashed border-slate-200 text-center space-y-2">
                        <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto">
                            <i data-lucide="network" class="w-5 h-5"></i>
                        </div>
                        <div class="font-bold text-slate-700 text-xs">Revue non initialisée</div>
                        <p class="text-[11px] text-slate-500 max-w-xs mx-auto leading-relaxed">
                            Les affirmations métier et les règles de cohérence physique s'afficheront après l'analyse d'un scénario.
                        </p>
                    </div>
                `;
            }

            const traceBox = document.getElementById('audit-traceability-box');
            if (traceBox) traceBox.innerHTML = "<div class='text-slate-400 italic text-center py-4'>Aucune exigence tracée.</div>";

            const orchBox = document.getElementById('orchestrator-log-box');
            if (orchBox) orchBox.innerHTML = `[${new Date().toLocaleTimeString()}] [Système] Prêt. En attente d'une instruction utilisateur.`;

            lucide.createIcons();
        }

        function resetConversation() {
            document.getElementById('messages-list').innerHTML = "";
            document.getElementById('messages-list').classList.add('hidden');
            document.getElementById('welcome-view').classList.remove('hidden');
            document.getElementById('user-input').value = "";
            removeAttachment();
            resetSidebar();
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // GESTION DU TIROIR MOBILE (DRAWER)
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('right-sidebar');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');
            if (!sidebar || !backdrop) return;
            const isOpen = !sidebar.classList.contains('translate-x-full');
            if (isOpen) {
                sidebar.classList.add('translate-x-full');
                backdrop.classList.add('hidden');
            } else {
                sidebar.classList.remove('translate-x-full');
                backdrop.classList.remove('hidden');
            }
        }

        // Gestion de la clé API Gemini dans la sidebar droite
        function toggleGeminiKeyPanel() {
            const panel = document.getElementById('gemini-key-panel');
            if (panel) panel.classList.toggle('hidden');
        }

        async function refreshGeminiKeyStatus() {
            const badge = document.getElementById('gemini-key-status-badge');
            if (!badge) return;
            const userKey = localStorage.getItem('user_gemini_api_key');
            if (userKey) {
                const masked = userKey.length >= 10 ? `${userKey.slice(0, 4)}…${userKey.slice(-4)}` : '***';
                badge.textContent = `Personnalisée (${masked})`;
                badge.className = "px-2 py-0.5 rounded-full text-[10px] font-semibold bg-blue-100 text-blue-700 border border-blue-200";
                return;
            }
            try {
                const res = await fetch('/api/config/gemini-key/status');
                const data = await res.json();
                if (data.configured) {
                    badge.textContent = `Par défaut (${data.masked})`;
                    badge.className = "px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-100 text-emerald-700 border border-emerald-200";
                } else {
                    badge.textContent = "Non configurée";
                    badge.className = "px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-100 text-amber-800 border border-amber-200";
                }
            } catch (e) {
                badge.textContent = "Hors ligne";
                badge.className = "px-2 py-0.5 rounded-full text-[10px] font-semibold bg-red-100 text-red-700";
            }
        }

        async function saveGeminiApiKey() {
            const input = document.getElementById('gemini-key-input');
            const btn = document.getElementById('gemini-key-save-btn');
            const fb = document.getElementById('gemini-key-feedback');
            const apiKey = (input?.value || '').trim();
            if (!apiKey) {
                localStorage.removeItem('user_gemini_api_key');
                fb.textContent = "Clé personnalisée supprimée. Utilisation de la clé par défaut.";
                fb.className = "text-[11px] text-amber-600 font-medium";
                fb.classList.remove('hidden');
                await refreshGeminiKeyStatus();
                setTimeout(() => {
                    document.getElementById('gemini-key-panel')?.classList.add('hidden');
                }, 1400);
                return;
            }
            btn.disabled = true;
            btn.textContent = "Vérif…";
            fb.classList.add('hidden');
            try {
                const res = await fetch('/api/config/gemini-key', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({api_key: apiKey})
                });
                const rawText = await res.text();
                let data = {};
                try {
                    data = JSON.parse(rawText);
                } catch (_) {
                    throw new Error(`Erreur serveur (${res.status}) : ${rawText.slice(0, 120)}`);
                }
                if (!res.ok) throw new Error(data.detail || "Clé invalide");
                localStorage.setItem('user_gemini_api_key', apiKey);
                fb.textContent = `Clé enregistrée dans votre navigateur (${data.active_model || 'Gemini'})`;
                fb.className = "text-[11px] text-emerald-600 font-medium";
                fb.classList.remove('hidden');
                input.value = "";
                await refreshGeminiKeyStatus();
                setTimeout(() => {
                    document.getElementById('gemini-key-panel')?.classList.add('hidden');
                }, 1400);
            } catch (err) {
                fb.textContent = `${err.message}`;
                fb.className = "text-[11px] text-red-600";
                fb.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = "Enregistrer";
            }
        }

        // Initialisation au chargement
        window.addEventListener('DOMContentLoaded', () => {
            resetSidebar();
            refreshGeminiKeyStatus();
        });
    </script>
    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>
